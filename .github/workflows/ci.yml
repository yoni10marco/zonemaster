name: CI

# Runs the same checks as `npm run check` on every push and pull request, so a
# change that breaks types, lint rules or tests is caught before it ships.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
